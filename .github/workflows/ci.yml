# SPDX-License-Identifier: MPL-2.0
name: Ddraig CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
# One run per ref: a newer push cancels the older run, so an older build can
# never reach the deploy job after a newer one. The deploy job's own `pages`
# group still serialises deployments.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # idris2 + pack toolchain, digest-pinned (tag: latest) per estate SHA-pin policy.
      # Replaces ghcr.io/idris-community/idris2:latest, whose :latest tag was removed upstream.
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Compile Ddraig
        run: idris2 Ddraig.idr -o ddraig
      - name: Type-check typed HTML core (proof O2 + alt-presence)
        run: idris2 --check Html.idr
      - name: Type-check a2ml STATE validator (proof O1 - validateState total)
        run: idris2 --check State.idr
      - name: Type-check accessibility attestation (proof O3 - echo types)
        run: idris2 --check Attest.idr
      - name: Test Markdown
        run: ./build/exec/ddraig test-markdown
      - name: Test Frontmatter
        run: ./build/exec/ddraig test-frontmatter
      - name: Test Full Pipeline
        run: ./build/exec/ddraig test-full
      - name: Test STATE validator (rejects invalid descriptile)
        run: ./build/exec/ddraig test-state
      - name: Test a11y attestation (certifies accessible, rejects inaccessible)
        run: ./build/exec/ddraig test-attest
      - name: Validate this repo's STATE descriptile (a2ml O1)
        run: ./build/exec/ddraig validate-state .machine_readable/descriptiles/STATE.a2ml
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # idris2 + pack toolchain, digest-pinned (tag: latest) per estate SHA-pin policy.
      # Replaces ghcr.io/idris-community/idris2:latest, whose :latest tag was removed upstream.
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Compile Ddraig
        run: idris2 Ddraig.idr -o ddraig
      - name: Build sample site
        # base-url makes sitemap.xml/feed.xml absolute (valid), and its path
        # (/ddraig-ssg) prefixes the template's root-relative links. Change if
        # the site moves to a custom domain.
        run: ./build/exec/ddraig build examples _site https://hyperpolymath.github.io/ddraig-ssg
      - name: Check sample site
        # `ddraig build` exits 0 when it finds no Markdown sources, so the
        # .md -> .adoc rename in #17 built an empty site and still passed.
        # Fail on that, and on links that would miss the Pages sub-path.
        run: |
          test -s _site/index.html
          test -s _site/about.html
          grep -q 'href="/ddraig-ssg/assets/style.css"' _site/index.html
      - name: Upload artifact
        # v5 pins its inner actions/upload-artifact to a commit SHA; v3 used the
        # `@v4` tag, which the SHA-pin policy rejects at job set-up. v4+ drops
        # dotfiles by default, so keep them: .well-known/ carries the O3
        # accessibility attestation.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true
  deploy:
    # Publish the sample site. Pages is set to build from GitHub Actions, so
    # this job is what puts https://hyperpolymath.github.io/ddraig-ssg online.
    # Pushes to main only: pull requests build and upload, but never deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write     # create the Pages deployment
      id-token: write  # OIDC token that deploy-pages exchanges for it
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
