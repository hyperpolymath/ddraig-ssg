name: Ddraig CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # idris2 + pack toolchain, digest-pinned (tag: latest) per estate SHA-pin policy.
      # Replaces ghcr.io/idris-community/idris2:latest, whose :latest tag was removed upstream.
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Compile Ddraig
        run: idris2 Ddraig.idr -o ddraig
      - name: Type-check typed HTML core (proof O2 + alt-presence)
        run: idris2 --check Html.idr
      - name: Test Markdown
        run: ./build/exec/ddraig test-markdown
      - name: Test Frontmatter
        run: ./build/exec/ddraig test-frontmatter
      - name: Test Full Pipeline
        run: ./build/exec/ddraig test-full
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # idris2 + pack toolchain, digest-pinned (tag: latest) per estate SHA-pin policy.
      # Replaces ghcr.io/idris-community/idris2:latest, whose :latest tag was removed upstream.
      image: ghcr.io/stefan-hoeck/idris2-pack@sha256:f0758996a931fb35d9ecb1de273c4d59dabe2a09b433afc7e357f65a08b7e1ff
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Compile Ddraig
        run: idris2 Ddraig.idr -o ddraig
      - name: Build sample site
        # base-url makes sitemap.xml/feed.xml absolute (valid). Change if the
        # site moves to a custom domain.
        run: ./build/exec/ddraig build examples _site https://hyperpolymath.github.io/ddraig-ssg
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
